    <style>
        /* ============================================
           CATEGORIES PAGE - MODERN STORE STYLE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0F172A;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        /* ----- Main Container with Grid Layout ----- */
        .categories-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* ----- Sidebar Styles ----- */
        .sidebar-left {
            position: sticky;
            top: 90px;
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            border: 1px solid #E2E8F0;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
        }

        .sidebar-left::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-left::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }

        .sidebar-left::-webkit-scrollbar-thumb {
            background: #6C3CE1;
            border-radius: 8px;
        }

        .sidebar-header {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            padding-bottom: 12px;
            border-bottom: 2px solid #E2E8F0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header i {
            color: #6C3CE1;
        }

        .sidebar-header span {
            font-size: 12px;
            font-weight: 400;
            color: #94A3B8;
            margin-left: auto;
        }

        /* Category List - SINGLE COLUMN */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-chip-side {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #334155;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .category-chip-side:hover {
            background: #f1f5f9;
            color: #0F172A;
        }

        .category-chip-side.active {
            background: #6C3CE1;
            color: white;
        }

        .category-chip-side.active .chip-count {
            color: rgba(255, 255, 255, 0.7);
        }

        .category-chip-side .chip-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            color: #6C3CE1;
        }

        .category-chip-side.active .chip-icon {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .category-chip-side .chip-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-chip-side .chip-count {
            font-size: 12px;
            color: #94A3B8;
            background: #f1f5f9;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .category-chip-side.active .chip-count {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
        }

        /* ----- Main Content Area ----- */
        .main-content {
            min-width: 0;
        }

        /* ----- Page Header ----- */
        .page-header {
            padding: 16px 0 20px;
            border-bottom: 2px solid #E2E8F0;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 i {
            color: #6C3CE1;
        }

        .page-header .header-sub {
            font-size: 14px;
            color: #94A3B8;
            margin-top: 4px;
        }

        /* ----- Section Header ----- */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h2 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 i {
            color: #6C3CE1;
            font-size: 18px;
        }

        .section-header .view-all {
            font-size: 14px;
            color: #6C3CE1;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .section-header .view-all:hover {
            color: #5A2FC4;
            text-decoration: underline;
        }

        /* ============================================
           SKELETON LOADERS
           ============================================ */

        /* Sidebar Skeleton */
        .skeleton-sidebar {
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            border: 1px solid #f0f0f0;
        }

        .skeleton-sidebar .skeleton-header {
            height: 24px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            margin-bottom: 16px;
            width: 60%;
        }

        .skeleton-sidebar .skeleton-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .skeleton-sidebar .skeleton-item:last-child {
            border-bottom: none;
        }

        .skeleton-sidebar .skeleton-item .skeleton-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        .skeleton-sidebar .skeleton-item .skeleton-text {
            height: 14px;
            flex: 1;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
        }

        .skeleton-sidebar .skeleton-item .skeleton-count {
            width: 30px;
            height: 18px;
            border-radius: 12px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        /* Category Skeleton */
        .skeleton-category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 32px;
        }

        .skeleton-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
        }

        .skeleton-chip .skeleton-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .skeleton-chip .skeleton-text {
            height: 14px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            flex: 1;
        }

        .skeleton-chip .skeleton-text.short {
            width: 30px;
            flex: none;
        }

        /* Product Skeleton */
        .skeleton-product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .skeleton-product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        .skeleton-product-card .skeleton-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .skeleton-product-card .skeleton-body {
            padding: 12px 14px 14px;
        }

        .skeleton-product-card .skeleton-body .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .skeleton-product-card .skeleton-body .skeleton-line.w-75 { width: 75%; }
        .skeleton-product-card .skeleton-body .skeleton-line.w-50 { width: 50%; }
        .skeleton-product-card .skeleton-body .skeleton-line.w-60 { width: 60%; }
        .skeleton-product-card .skeleton-body .skeleton-line.w-40 { width: 40%; }

        .skeleton-product-card .skeleton-body .skeleton-price {
            height: 20px;
            width: 40%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            margin: 8px 0 10px;
        }

        .skeleton-product-card .skeleton-body .skeleton-actions {
            display: flex;
            gap: 8px;
        }

        .skeleton-product-card .skeleton-body .skeleton-btn {
            flex: 1;
            height: 32px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }

        .skeleton-product-card .skeleton-body .skeleton-btn-heart {
            width: 32px;
            height: 32px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }

        /* For You Skeleton */
        .skeleton-foryou-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .skeleton-foryou-card {
            display: flex;
            gap: 14px;
            background: white;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #f0f0f0;
            align-items: center;
        }

        .skeleton-foryou-card .skeleton-foryou-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        .skeleton-foryou-card .skeleton-foryou-body {
            flex: 1;
        }

        .skeleton-foryou-card .skeleton-foryou-body .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .skeleton-foryou-card .skeleton-foryou-body .skeleton-line.w-75 { width: 75%; }
        .skeleton-foryou-card .skeleton-foryou-body .skeleton-line.w-50 { width: 50%; }
        .skeleton-foryou-card .skeleton-foryou-body .skeleton-line.w-60 { width: 60%; }

        .skeleton-foryou-card .skeleton-foryou-body .skeleton-price {
            height: 18px;
            width: 40%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            margin-top: 4px;
        }

        .skeleton-foryou-card .skeleton-foryou-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .skeleton-foryou-card .skeleton-foryou-actions .skeleton-btn-sm {
            width: 60px;
            height: 28px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }

        .skeleton-foryou-card .skeleton-foryou-actions .skeleton-btn-heart-sm {
            width: 30px;
            height: 28px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
            margin: 0 auto;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ============================================
           ACTUAL CONTENT STYLES
           ============================================ */

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 32px;
        }

        .category-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #0F172A;
        }

        .category-chip:hover {
            border-color: #6C3CE1;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .category-chip .chip-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .category-chip .chip-icon i {
            color: #6C3CE1;
        }

        .category-chip .chip-label {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-chip .chip-count {
            font-size: 11px;
            color: #94A3B8;
            margin-left: auto;
        }

        /* Recommended Products */
        .recommended-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .recommended-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .recommended-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-color: #6C3CE1;
        }

        .recommended-card .card-image {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            background: #f8fafc;
        }

        .recommended-card .card-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .recommended-card:hover .card-image img {
            transform: scale(1.05);
        }

        .recommended-card .card-image .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            background: #EF4444;
            color: white;
        }

        .recommended-card .card-image .card-sold {
            position: absolute;
            bottom: 8px;
            left: 8px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            backdrop-filter: blur(4px);
        }

        .recommended-card .card-image .card-rating-float {
            position: absolute;
            bottom: 8px;
            right: 8px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            color: #F59E0B;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .recommended-card .card-body {
            padding: 12px 14px 14px;
        }

        .recommended-card .card-body .card-name {
            font-weight: 600;
            font-size: 14px;
            color: #0F172A;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .recommended-card .card-body .card-meta {
            font-size: 12px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .recommended-card .card-body .card-meta .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #94A3B8;
        }

        .recommended-card .card-body .card-price {
            font-weight: 700;
            font-size: 18px;
            color: #0F172A;
        }

        .recommended-card .card-body .card-price .original {
            font-size: 14px;
            color: #94A3B8;
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 6px;
        }

        .recommended-card .card-body .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .recommended-card .card-body .btn-add {
            flex: 1;
            padding: 6px 12px;
            background: #0F172A;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .recommended-card .card-body .btn-add:hover {
            background: #6C3CE1;
        }

        .recommended-card .card-body .btn-wish {
            padding: 6px 10px;
            border: 1px solid #E2E8F0;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #94A3B8;
            font-size: 14px;
        }

        .recommended-card .card-body .btn-wish:hover {
            border-color: #EF4444;
            color: #EF4444;
        }

        .recommended-card .card-body .btn-wish.active {
            border-color: #EF4444;
            color: #EF4444;
            background: rgba(239, 68, 68, 0.05);
        }

        /* For You Products */
        .foryou-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .foryou-card {
            display: flex;
            gap: 14px;
            background: white;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
            align-items: center;
        }

        .foryou-card:hover {
            transform: translateX(4px);
            border-color: #6C3CE1;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .foryou-card .foryou-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f8fafc;
        }

        .foryou-card .foryou-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foryou-card .foryou-info {
            flex: 1;
            min-width: 0;
        }

        .foryou-card .foryou-info .foryou-name {
            font-weight: 600;
            font-size: 14px;
            color: #0F172A;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .foryou-card .foryou-info .foryou-meta {
            font-size: 12px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .foryou-card .foryou-info .foryou-meta .tag {
            background: #f1f5f9;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .foryou-card .foryou-info .foryou-price {
            font-weight: 700;
            font-size: 16px;
            color: #0F172A;
            margin-top: 4px;
        }

        .foryou-card .foryou-info .foryou-price .original {
            font-size: 13px;
            color: #94A3B8;
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 6px;
        }

        .foryou-card .foryou-info .foryou-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #94A3B8;
            margin-top: 2px;
        }

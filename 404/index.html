<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>404 · Page Not Found · Sucess Technology</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#6C3CE1',
                        primaryHover: '#5A2FC4',
                        dark: '#0F172A',
                        'dark-secondary': '#1E293B'
                    },
                }
            }
        }
    </script>
    <style>
        /* ============================================
           404 ERROR PAGE - MODERN & PLAYFUL
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* Animated background */
        .error-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .error-bg .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            animation: float-circle 20s ease-in-out infinite;
        }

        .error-bg .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #6C3CE1;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .error-bg .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #EF4444;
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        .error-bg .circle:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #F59E0B;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float-circle {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 40px) scale(0.9); }
            75% { transform: translate(40px, 20px) scale(1.05); }
        }

        /* Main container */
        .error-container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 Number */
        .error-number {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #6C3CE1, #EF4444, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
        }

        .error-number::after {
            content: '404';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6C3CE1, #EF4444, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
            transform: scale(1.1);
        }

        /* Icon */
        .error-icon {
            font-size: 80px;
            color: #6C3CE1;
            margin-bottom: 8px;
            display: block;
            animation: bounce-icon 2s ease-in-out infinite;
        }

        @keyframes bounce-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        /* Title */
        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 12px;
        }

        .error-title span {
            color: #6C3CE1;
        }

        /* Description */
        .error-description {
            font-size: 16px;
            color: #64748B;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 28px;
        }

        /* Search Box */
        .error-search {
            display: flex;
            gap: 10px;
            max-width: 460px;
            margin: 0 auto 28px;
            background: white;
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 2px solid #E2E8F0;
            transition: border-color 0.3s ease;
        }

        .error-search:focus-within {
            border-color: #6C3CE1;
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.12);
        }

        .error-search input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            background: transparent;
            color: #0F172A;
        }

        .error-search input::placeholder {
            color: #94A3B8;
        }

        .error-search button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .error-search button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.4);
        }

        /* Action Buttons */
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .error-actions .btn-primary {
            padding: 12px 28px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.3);
        }

        .error-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 60, 225, 0.4);
        }

        .error-actions .btn-secondary {
            padding: 12px 28px;
            background: white;
            color: #475569;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .error-actions .btn-secondary:hover {
            background: #f8fafc;
            border-color: #94A3B8;
            transform: translateY(-2px);
        }

        .error-actions .btn-secondary.help {
            border-color: #EF4444;
            color: #EF4444;
        }

        .error-actions .btn-secondary.help:hover {
            background: #FEF2F2;
            border-color: #EF4444;
        }

        /* Quick Links */
        .error-quick-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 2px solid #E2E8F0;
        }

        .error-quick-links a {
            font-size: 14px;
            color: #94A3B8;
            text-decoration: none;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-quick-links a:hover {
            color: #6C3CE1;
        }

        .error-quick-links a i {
            font-size: 12px;
        }

        /* Floating elements (decorative) */
        .float-deco {
            position: absolute;
            font-size: 40px;
            opacity: 0.08;
            pointer-events: none;
            animation: float-deco 15s ease-in-out infinite;
        }

        .float-deco:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        .float-deco:nth-child(2) {
            bottom: 15%;
            right: 8%;
            animation-delay: -5s;
        }
        .float-deco:nth-child(3) {
            top: 20%;
            right: 15%;
            animation-delay: -10s;
            font-size: 24px;
        }

        @keyframes float-deco {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, -20px) rotate(5deg); }
            66% { transform: translate(-10px, 15px) rotate(-3deg); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .error-number {
                font-size: 80px;
            }

            .error-icon {
                font-size: 56px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-description {
                font-size: 14px;
                padding: 0 12px;
            }

            .error-search {
                flex-direction: column;
                padding: 8px;
            }

            .error-search button {
                width: 100%;
                justify-content: center;
            }

            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .error-actions .btn-primary,
            .error-actions .btn-secondary {
                width: 100%;
                justify-content: center;
            }

            .error-quick-links {
                gap: 12px;
            }
            .error-quick-links a {
                font-size: 12px;
            }

            .float-deco {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .error-number {
                font-size: 60px;
            }

            .error-icon {
                font-size: 40px;
            }

            .error-title {
                font-size: 18px;
            }

            .error-description {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="error-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Decorative Floating Elements -->
    <div class="float-deco">💻</div>
    <div class="float-deco">📱</div>
    <div class="float-deco">⚡</div>

    <!-- Main Error Content -->
    <div class="error-container">

        <!-- 404 Number -->
        <div class="error-number">404</div>

        <!-- Icon -->
        <span class="error-icon">
            <i class="fas fa-compass"></i>
        </span>

        <!-- Title -->
        <h1 class="error-title">
            Oops! Page <span>Lost</span> in Space
        </h1>

        <!-- Description -->
        <p class="error-description">
            The page you're looking for seems to have wandered off into the digital void.
            Don't worry, we'll help you find your way back.
        </p>

        <!-- Search -->
        <div class="error-search">
            <input type="text" id="errorSearchInput" placeholder="Search for products..." />
            <button onclick="handleSearch()">
                <i class="fas fa-search"></i> Search
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="error-actions">
            <a href="index.html" class="btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="products.html" class="btn-secondary">
                <i class="fas fa-store"></i> Browse Products
            </a>
            <a href="contact.html" class="btn-secondary help">
                <i class="fas fa-headset"></i> Get Help
            </a>
        </div>

        <!-- Quick Links -->
        <div class="error-quick-links">
            <a href="/index.html"><i class="fas fa-home"></i> Home</a>
            <a href="products.html"><i class="fas fa-box"></i> Products</a>
            <a href="/categories.html"><i class="fas fa-th-large"></i> Categories</a>
            <a href="/deals/"><i class="fas fa-tags"></i> Deals</a>
            <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
            <a href="about.html"><i class="fas fa-info-circle"></i> About</a>
        </div>

    </div>

    <!-- ============================================
         SCRIPTS
         ============================================ -->
    <script>
        // ============================================================
        //  404 ERROR PAGE
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 404 Error page loaded');

            // Search handler
            window.handleSearch = function() {
                const input = document.getElementById('errorSearchInput');
                const query = input.value.trim();
                if (query) {
                    window.location.href = `products.html?search=${encodeURIComponent(query)}`;
                } else {
                    // Focus the input if empty
                    input.focus();
                    input.style.borderColor = '#EF4444';
                    setTimeout(() => {
                        input.style.borderColor = '';
                    }, 1000);
                }
            };

            // Enter key on search
            document.getElementById('errorSearchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            });

            // Track 404 errors
            if (typeof gtag !== 'undefined') {
                gtag('event', '404_error', {
                    'page_path': window.location.pathname
                });
            }

            console.log('✅ 404 page ready');
        });

        // Handle search globally
        window.handleSearch = function() {
            const input = document.getElementById('errorSearchInput');
            const query = input.value.trim();
            if (query) {
                window.location.href = `products.html?search=${encodeURIComponent(query)}`;
            }
        };
    </script>
</body>
</html>
